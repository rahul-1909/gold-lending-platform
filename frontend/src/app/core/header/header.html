<header class="bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/80 sticky top-0 z-50 transition-all">
  <nav class="container mx-auto px-6 py-3.5 flex justify-between items-center">
    
    <!-- Brand Logo -->
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 via-yellow-500 to-amber-600 p-0.5 shadow-md shadow-amber-500/20">
        <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
          <svg class="w-5 h-5 text-amber-400" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L14.39 8.26L21 9.27L16.5 14.14L17.77 21L12 17.77L6.23 21L7.5 14.14L3 9.27L9.61 8.26L12 2Z"/>
          </svg>
        </div>
      </div>
      <a routerLink="/dashboard" class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
        <span>Star Finance</span>
        <span class="text-[10px] uppercase font-mono font-bold px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-300 border border-amber-500/30">CLIENT</span>
      </a>
    </div>

    <!-- Center Navigation Links -->
    <div class="hidden md:flex space-x-1 items-center bg-slate-900/60 p-1 rounded-xl border border-slate-800">
      <a routerLink="/dashboard" 
         routerLinkActive="bg-amber-500/15 text-amber-300 font-bold border border-amber-500/30" 
         [routerLinkActiveOptions]="{exact: true}" 
         class="text-slate-300 hover:text-white px-4 py-1.5 rounded-lg text-sm transition-all duration-200">
        Dashboard
      </a>
      <a routerLink="/kyc" 
         routerLinkActive="bg-amber-500/15 text-amber-300 font-bold border border-amber-500/30" 
         class="text-slate-300 hover:text-white px-4 py-1.5 rounded-lg text-sm transition-all duration-200">
        KYC Verification
      </a>
      <a routerLink="/loan-application" 
         routerLinkActive="bg-amber-500/15 text-amber-300 font-bold border border-amber-500/30" 
         class="text-slate-300 hover:text-white px-4 py-1.5 rounded-lg text-sm transition-all duration-200">
        Apply for Loan
      </a>
    </div>

    <!-- Right Side: Profile Dropdown -->
    <div class="relative">
      <button (click)="toggleDropdown()" 
              class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 flex items-center justify-center font-black text-sm shadow-lg shadow-amber-500/20 hover:scale-105 transition-all duration-200 border border-amber-300/40">
        {{ userInitial$ | async }}
      </button>

      <!-- Dropdown Menu -->
      <div *ngIf="isDropdownOpen" 
           class="absolute right-0 mt-3 w-52 bg-slate-900/95 backdrop-blur-2xl rounded-2xl shadow-2xl py-2 z-50 border border-slate-800 text-sm">
        <div class="px-4 py-2 border-b border-slate-800">
          <p class="text-xs text-slate-400">Signed in as</p>
          <p class="text-xs font-bold text-amber-400 mt-0.5 truncate">Active Customer</p>
        </div>
        <a routerLink="/kyc" 
           (click)="isDropdownOpen = false" 
           class="flex items-center space-x-2.5 px-4 py-2.5 text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors">
          <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span>My Profile</span>
        </a>
        <a (click)="openChangePasswordDialog()" 
           class="flex items-center space-x-2.5 px-4 py-2.5 text-slate-300 hover:text-white hover:bg-slate-800/60 cursor-pointer transition-colors">
          <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
          <span>Change Password</span>
        </a>
        <div class="border-t border-slate-800 my-1"></div>
        <a (click)="logout()" 
           class="flex items-center space-x-2.5 px-4 py-2.5 text-red-400 hover:bg-red-950/30 cursor-pointer transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span>Sign Out</span>
        </a>
      </div>
    </div>
  </nav>
</header>
